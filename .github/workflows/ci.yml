name: CI

# The safety net the audit found missing: nothing mechanically stopped a
# regression from reaching the installer. Runs on Windows (the product's real
# target) and Linux (catches path assumptions that only Windows hides).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Qt has no display on a CI runner; widgets still build offscreen.
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: Lint & versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev --group server

      - name: Ruff
        run: uv run ruff check . --output-format=github

      - name: Versions must agree everywhere
        # pyproject / _version.py / installer / README. They drifted to four
        # different values because the bump script only wrote two of them.
        run: uv run python scripts/bump_version.py --check

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev --group server

      - name: Run tests
        # -rs lists every skip: a runner with no CMYK ICC profile silently
        # skips the colour-management and PDF/X tests, and a green run that
        # skipped them is exactly the false assurance to avoid.
        run: uv run pytest tests/ -q -rs --durations=10

      - name: Report skipped tests
        if: always()
        shell: bash
        run: |
          uv run pytest tests/ -q -rs 2>&1 | grep -i "^SKIPPED" || \
            echo "Aucun test sauté sur ${{ matrix.os }}."

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev --group server

      - name: Measure
        # No fail_under yet: real coverage is ~34 % once src/ui is counted, and
        # a threshold set above reality would just be disabled on day one.
        # Raise it deliberately as pytest-qt tests land (audit, Sprint 3).
        run: |
          uv run pytest tests/ -q \
            --cov=src --cov=activation_server \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
