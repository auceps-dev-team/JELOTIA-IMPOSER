name: CI

# The safety net the audit found missing: nothing mechanically stopped a
# regression from reaching the installer. Runs on Windows (the product's real
# target) and Linux (catches path assumptions that only Windows hides).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Qt has no display on a CI runner; widgets still build offscreen.
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: Lint & versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev --group server

      - name: Ruff
        run: uv run ruff check . --output-format=github

      - name: Line length must not regress
        # E501 is not enforced repo-wide: 91 inherited lines exceed 100 columns
        # and reformatting them costs 820-2557 lines of churn for a purely
        # cosmetic rule. This ratchet freezes that count instead — the debt is
        # tolerated but can no longer grow.
        run: uv run python scripts/check_line_length.py

      - name: Versions must agree everywhere
        # pyproject / _version.py / installer / README. They drifted to four
        # different values because the bump script only wrote two of them.
        run: uv run python scripts/bump_version.py --check

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev --group server

      - name: Run tests
        # -rs lists every skip inline: a runner with no CMYK ICC profile
        # silently skips the colour-management and PDF/X tests, and a green run
        # that skipped them is exactly the false assurance to avoid. Reported
        # from THIS run — re-running the suite just to print the list would
        # double CI time per OS for nothing.
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/ -q -rs --durations=10 --junit-xml=junit-${{ matrix.os }}.xml 2>&1 | tee pytest.log

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: junit-${{ matrix.os }}.xml
          if-no-files-found: warn

      - name: Skipped tests summary
        if: always()
        shell: bash
        run: |
          echo "### Tests sautés — ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          if grep -i "^SKIPPED" pytest.log >> "$GITHUB_STEP_SUMMARY"; then
            echo "Des tests ont été sautés : un vert obtenu en sautant n'est pas un vert." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Aucun." >> "$GITHUB_STEP_SUMMARY"
          fi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev --group server

      - name: Measure
        # No fail_under yet: real coverage is ~34 % once src/ui is counted, and
        # a threshold set above reality would just be disabled on day one.
        # Raise it deliberately as pytest-qt tests land (audit, Sprint 3).
        run: |
          uv run pytest tests/ -q \
            --cov=src --cov=activation_server \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
