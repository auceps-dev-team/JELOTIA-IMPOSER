[project]
name = "jelotia-imposer"
version = "1.45.0"
description = "Logiciel Professionnel d'Imposition Automatique Industrielle"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "loguru>=0.7.3",
    # Utilisé directement par icc_engine.total_ink_coverage : la mesure
    # d'encrage coûtait ~45 s par planche A1 en Python pur. numpy n'arrivait
    # jusque-là que par opencv-python/shapely, retirées ci-dessous — sans
    # déclaration explicite, le calcul serait silencieusement retombé sur la
    # boucle lente.
    "numpy>=2.0",
    "pikepdf>=9.4.2",
    "pillow>=11.0.0",
    "pydantic>=2.10.4",
    "pymupdf==1.28.0",
    "pyside6>=6.8.1",
    "qrcode>=8.0",
    "rectpack>=0.2.2",
    "reportlab>=4.2.5",
    "sqlalchemy>=2.0.36",
    "watchdog>=6.0.0",
    "openpyxl>=3.1.5",
    "cryptography>=49.0.0",
]
# Retirées (audit §6.5) : aucun `import` dans tout le dépôt.
#   opencv-python (~60 Mo), colour-science, pyqtgraph, shapely, colorama.
# opencv-python à lui seul alourdissait l'installeur de plusieurs dizaines de Mo.
# pyqtgraph était déclarée alors que dashboard.py dessine son graphique à la main.

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# Local working directories must not move the lint count: without this, a
# personal scratch/ folder made the same command report 123 errors on one
# machine and 160 on another, which is unusable as a CI gate.
exclude = [
    "scratch",
    "dist",
    "build",
    "integration_test_data",
    "graphify-out",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
# E501 n'est pas appliqué à l'échelle du dépôt, et c'est une décision mesurée,
# pas un renoncement : 91 lignes héritées dépassent 100 colonnes ; les replier
# coûte 820 lignes de diff en ne formatant que les fichiers concernés, 2 557 en
# formatant tout — pour une règle purement cosmétique, sur un dépôt où plusieurs
# personnes poussent en parallèle (bruit dans git blame, conflits de fusion).
#
# À la place, scripts/check_line_length.py fige ce nombre comme plafond et la CI
# échoue si une ligne trop longue est ajoutée. La dette existante ne bloque
# personne mais ne peut plus grandir ; corriger des lignes permet d'abaisser le
# plafond (--update). Tout le reste (F, E7xx, I) est appliqué normalement.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.black]
line-length = 100
target-version = ['py312']

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.1.0",
    "pyinstaller>=6.21.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.15.20",
]
# Activation server only — runs on JELOTIA infra, never bundled in the app.
# Install with: uv sync --group server   (or `uv run --group server ...`)
server = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.28.0",
]
