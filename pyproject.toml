[project]
name = "jelotia-imposer"
version = "1.40.0"
description = "Logiciel Professionnel d'Imposition Automatique Industrielle"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "colorama>=0.4.6",
    "colour-science>=0.4.4",
    "loguru>=0.7.3",
    "opencv-python>=4.10.0",
    "pikepdf>=9.4.2",
    "pillow>=11.0.0",
    "pydantic>=2.10.4",
    "pymupdf==1.28.0",
    "pyside6>=6.8.1",
    "pyqtgraph>=0.13.3",
    "qrcode>=8.0",
    "rectpack>=0.2.2",
    "reportlab>=4.2.5",
    "shapely>=2.0.6",
    "sqlalchemy>=2.0.36",
    "watchdog>=6.0.0",
    "openpyxl>=3.1.5",
    "cryptography>=49.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# Local working directories must not move the lint count: without this, a
# personal scratch/ folder made the same command report 123 errors on one
# machine and 160 on another, which is unusable as a CI gate.
exclude = [
    "scratch",
    "dist",
    "build",
    "integration_test_data",
    "graphify-out",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
# TODO (audit Sprint 3) — lever cette exception.
# E501 est temporairement toléré : 90 lignes trop longues, héritées, à traiter
# par lots. Tout le reste (F, E7xx, I) est appliqué et la CI échoue dessus, ce
# qui donne une barrière utile dès maintenant plutôt qu'un pipeline rouge en
# permanence que l'équipe apprendrait à ignorer. Les nouvelles lignes ajoutées
# respectent déjà la limite de 100.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.black]
line-length = 100
target-version = ['py312']

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.1.0",
    "pyinstaller>=6.21.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]
# Activation server only — runs on JELOTIA infra, never bundled in the app.
# Install with: uv sync --group server   (or `uv run --group server ...`)
server = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.28.0",
]
